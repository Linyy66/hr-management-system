spring:
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver  # MySQL 8 驱动
    url: jdbc:mysql://localhost:3306/hr_management?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root  # 替换为实际用户名
    password: 549345  # 替换为实际密码
    hikari:
      maximum-pool-size: 10  # 连接池最大连接数
      minimum-idle: 5        # 最小空闲连接数
      idle-timeout: 300000   # 空闲超时时间（5分钟）

  # 数据库初始化脚本
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      encoding: UTF-8

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/**/*.xml  # Mapper XML路径
  type-aliases-package: com.example.hr.entity  # 实体类别名包
  configuration:
    map-underscore-to-camel-case: true  # 下划线转驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 打印SQL日志
    jdbc-type-for-null: NULL  # 避免NULL插入报错

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /hr
  encoding:
    charset: UTF-8
    force: true

# 日志配置
logging:
  level:
    root: INFO
    com.example.hr.mapper: DEBUG  # Mapper接口日志级别
    org.springframework: WARN
    org.springframework.security: INFO  # 安全框架日志

# JWT 配置（自定义）
jwt:
  secret: your-secret-key-123456  # 替换为实际密钥（建议32位以上）
  expiration: 86400000  # 令牌有效期（24小时，单位：毫秒）