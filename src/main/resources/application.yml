server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      force: true
      force-request: true
      force-response: true


spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hr_system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 549345


  web:
    resources:
      static-locations: classpath:/static/
      index-page: login.html


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.MySQL8Dialect


  jackson:
    serialization:
      write-dates-as-timestamps: false

  # 日志配置
  logging:
    level:
      org.hibernate.SQL: DEBUG
      org.hibernate.type.descriptor.sql: TRACE
      org.hibernate.engine.jdbc.spi.SqlExceptionHelper: ERROR
      org.springframework.orm.jpa: DEBUG

  # Hibernate 配置
  spring:
    jpa:
      properties:
        hibernate:
          format_sql: true
          show_sql: true
          use_sql_comments: true
      show-sql: true

