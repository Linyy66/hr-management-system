<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>HRMS - 用户注册</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="/app/styles.css">
</head>
<body>
    <div class="container">
        <div class="card" style="max-width: 500px; margin: 100px auto;">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h1>HRMS</h1>
                <p>人力资源管理系统</p>
            </div>
            
            <h2 style="text-align: center;">用户注册</h2>

            <form method="post" action="/api/auth/register">
                <div class="form-group">
                    <label for="reg_username">用户名</label>
                    <input id="reg_username" name="username" placeholder="请输入登录用户名" autocomplete="username" />
                </div>
                <div class="form-group">
                    <label for="reg_password">密码</label>
                    <input id="reg_password" name="password" type="password" placeholder="请输入密码" autocomplete="new-password" />
                </div>
                <div class="form-group">
                    <label for="reg_role">注册角色</label>
                    <!-- 公开注册仅允许 EMPLOYEE -->
                    <select id="reg_role" name="role">
                        <option value="EMPLOYEE">普通员工 (EMPLOYEE)</option>
                    </select>
                </div>
                <div style="margin: 1.5rem 0;">
                    <button class="btn-primary" style="width: 100%;" type="submit">注册并返回登录</button>
                </div>
            </form>
            <p class="small">注意：这是演示页面，实际系统中填写信息后点击注册按钮可完成注册</p>

            <div id="registerStatus" class="status"></div>

            <div class="card" style="margin-top: 2rem; background: #f1f5f9;">
                <p style="margin: 0;">已有账号？ <a href="/login.html" class="btn-link">立即登录</a></p>
            </div>

            <div class="footer-note" style="margin-top: 1rem;">
                说明：默认高权限账号为：<br>
                管理员：admin/adminpass<br>
                人事专员：spec/specpass<br>
                人事经理：mgr/mgrpass
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form');
            if (form) {
                form.addEventListener('submit', handleRegister);
            }
        });

        async function handleRegister(e) {
            e.preventDefault();
            
            const username = document.getElementById('reg_username').value;
            const password = document.getElementById('reg_password').value;
            const role = document.getElementById('reg_role').value;
            const statusDiv = document.getElementById('registerStatus');
            
            if (!username || !password) {
                showStatus(statusDiv, '请输入用户名和密码', 'error');
                return;
            }
            
            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);
                formData.append('role', role);
                
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.redirected) {
                    window.location.href = response.url;
                } else {
                    const result = await response.json();
                    if (result.result === 'ok') {
                        showStatus(statusDiv, '注册成功，请登录', 'success');
                        setTimeout(() => {
                            window.location.href = '/login.html';
                        }, 1000);
                    } else {
                        showStatus(statusDiv, result.error || '注册失败', 'error');
                    }
                }
            } catch (error) {
                console.error('Registration error:', error);
                showStatus(statusDiv, '注册失败，请稍后重试', 'error');
            }
        }
        
        function showStatus(element, message, type) {
            element.textContent = message;
            element.className = 'status ' + type;
        }
    </script>
</body>
</html>
