<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>员工管理 - 人力资源管理系统</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/axios/1.3.4/axios.min.js"></script>
</head>
<body>
<div class="container">
    <h1>员工管理</h1>

    <div class="operate-bar">
        <button id="addBtn" class="btn primary">添加员工</button>
    </div>

    <div class="search-form">
        <input type="text" id="searchName" placeholder="请输入员工姓名">
        <select id="searchDept">
            <option value="">全部部门</option>
        </select>
        <button id="searchBtn" class="btn primary">查询</button>
        <button id="resetBtn" class="btn default">重置</button>
    </div>

    <table class="emp-table">
        <thead>
        <tr>
            <th>员工编号</th>
            <th>姓名</th>
            <th>性别</th>
            <th>手机号</th>
            <th>部门</th>
            <th>岗位</th>
            <th>入职日期</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody id="empTableBody">
        <!-- 员工数据将通过JS动态加载 -->
        </tbody>
    </table>

    <div class="pagination">
        <button id="prevPage" class="btn default">上一页</button>
        <span id="pageInfo">第 1 页 / 共 0 页</span>
        <button id="nextPage" class="btn default">下一页</button>
    </div>
</div>

<!-- 员工表单弹窗 -->
<div id="empModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="modalTitle">添加员工</h2>
        <form id="empForm">
            <input type="hidden" id="empId">

            <div class="form-group">
                <label for="empName">姓名:</label>
                <input type="text" id="empName" required>
            </div>

            <div class="form-group">
                <label for="empGender">性别:</label>
                <select id="empGender" required>
                    <option value="1">男</option>
                    <option value="2">女</option>
                </select>
            </div>

            <div class="form-group">
                <label for="empIdCard">身份证号:</label>
                <input type="text" id="empIdCard">
            </div>

            <div class="form-group">
                <label for="empMobile">手机号:</label>
                <input type="text" id="empMobile">
            </div>

            <div class="form-group">
                <label for="empEmail">邮箱:</label>
                <input type="email" id="empEmail">
            </div>

            <div class="form-group">
                <label for="empDept">部门:</label>
                <select id="empDept" required>
                    <option value="">请选择部门</option>
                </select>
            </div>

            <div class="form-group">
                <label for="empJob">岗位:</label>
                <select id="empJob" required>
                    <option value="">请先选择部门</option>
                </select>
            </div>

            <div class="form-group">
                <label for="empEducation">学历:</label>
                <select id="empEducation">
                    <option value="高中及以下">高中及以下</option>
                    <option value="专科">专科</option>
                    <option value="本科">本科</option>
                    <option value="硕士">硕士</option>
                    <option value="博士及以上">博士及以上</option>
                </select>
            </div>

            <div class="form-group">
                <label for="empHireDate">入职日期:</label>
                <input type="date" id="empHireDate" required>
            </div>

            <div class="form-btn-group" style="text-align: center;">
                <button type="submit" class="btn primary">保存</button>
                <button type="button" id="cancelBtn" class="btn default">取消</button>
            </div>
        </form>
    </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
