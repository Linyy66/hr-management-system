<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - HRMS</title>
    <link rel="stylesheet" href="/app/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="logo">
                <h1>HRMS</h1>
                <span>系统管理平台</span>
            </div>
            <div class="nav-menu">
                <ul>
                    <li><a href="/admin/index.html" class="nav-link">返回首页</a></li>
                </ul>
            </div>
            <div class="user-info">
                <span id="current-user">管理员</span>
                <span class="role-badge admin">系统管理员</span>
                <button id="logout-btn" class="btn-secondary btn-small">退出</button>
            </div>
        </div>
    </nav>

    <div class="container main-content">
        <div class="card">
            <h2>用户管理</h2>
            <button id="add-user-btn" class="btn-primary">新增用户</button>
        </div>
        
        <div class="card">
            <h3>用户搜索</h3>
            <div class="search-bar">
                <input type="text" id="user-search" placeholder="按用户名或角色搜索">
                <button class="btn-primary">搜索</button>
            </div>
        </div>
        
        <div class="card">
            <h3>用户列表</h3>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>用户名</th>
                        <th>角色</th>
                        <th>状态</th>
                        <th>创建时间</th>
                        <th>最后登录</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="users-body">
                    <!-- 动态加载用户列表 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 移除所有JavaScript代码，使用纯后端HTML/CSS方式 -->
</body>
</html>
