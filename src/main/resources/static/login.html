<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>HRMS - 登录与注册</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="/app/styles.css">
</head>
<body>
<div class="container">
    <div class="card">
        <h1>HRMS - 登录与注册</h1>
        <h2>登录（用于 API Basic Auth）</h2>

        <div class="form-row">
            <label for="username">用户名</label>
            <input id="username" value="admin" />
        </div>
        <div class="form-row">
            <label for="password">密码</label>
            <input id="password" type="password" value="adminpass" />
            <button id="btnSaveCreds">保存并登录</button>
        </div>
        <div id="loginStatus" class="status"></div>

        <div class="panel">
            <button id="goRegister" class="btn-link">没有账号？去注册（仅普通员工自助注册）</button>
        </div>

        <div class="footer-note">
            说明：默认账号：admin/adminpass（管理员）；spec/specpass（人事专员）；mgr/mgrpass（人事经理）。<br>
            管理员可在登录后通过管理界面创建其他 HR 账号；普通员工请在注册页自助注册。
        </div>
    </div>
</div>

<script src="/app/js/login.js"></script>
</body>
</html>
