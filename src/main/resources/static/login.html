<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title>HRMS - 登录与注册</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/app/styles.css" />
</head>
<body class="auth-page">
<div class="auth-box" role="main" aria-labelledby="authTitle">
    <h1 id="authTitle" class="auth-title">HRMS - 登录与注册</h1>

    <div class="auth-section">
        <h2 class="auth-subtitle">登录（用于 API Basic Auth）</h2>

        <div class="form-row">
            <label for="username">用户名</label>
            <input id="username" value="admin" autocomplete="username" />
        </div>

        <div class="form-row">
            <label for="password">密码</label>
            <input id="password" type="password" value="adminpass" autocomplete="current-password" />
        </div>

        <div class="form-row" style="justify-content:flex-end">
            <button id="btnSaveCreds">保存并登录</button>
        </div>

        <div id="loginStatus" class="status" aria-live="polite"></div>

        <div class="auth-actions">
            <button id="goRegister" class="btn-link">没有账号？去注册（普通员工自助注册）</button>
        </div>

        <div class="small footer-note">默认账号：admin/adminpass（管理员）；spec/specpass（人事专员）；mgr/mgrpass（人事经理）。</div>
    </div>
</div>

<script src="/app/js/login.js"></script>
</body>
</html>
