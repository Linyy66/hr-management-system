<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>员工档案管理 - HRMS</title>
    <link rel="stylesheet" href="/app/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="logo">
                <h1>HRMS</h1>
                <span>人事专员平台</span>
            </div>
            <div class="nav-menu">
                <ul>
                    <li><a href="/hr_spec/index.html" class="nav-link">返回首页</a></li>
                </ul>
            </div>
            <div class="user-info">
                <span id="current-user">人事专员</span>
                <span class="role-badge hr_spec">人事专员</span>
                <button id="logout-btn" class="btn-secondary btn-small">退出</button>
            </div>
        </div>
    </nav>

    <div class="container main-content">
        <div class="card">
            <h2>员工档案管理</h2>
            <button id="add-staff-btn" class="btn-primary">新增员工档案</button>
        </div>
        
        <div class="card">
            <h3>档案搜索</h3>
            <div class="search-bar">
                <input type="text" id="archive-search" placeholder="按姓名、员工编号或部门搜索">
                <button class="btn-primary">搜索</button>
            </div>
        </div>
        
        <div class="card">
            <h3>员工档案列表</h3>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>员工编号</th>
                        <th>姓名</th>
                        <th>性别</th>
                        <th>部门</th>
                        <th>职位</th>
                        <th>联系电话</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="archive-body">
                    <!-- 动态加载档案列表 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 移除所有JavaScript代码，使用纯后端HTML/CSS方式 -->
</body>
</html>
