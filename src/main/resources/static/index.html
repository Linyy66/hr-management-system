<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS - 首页</title>
    <link rel="stylesheet" href="/app/styles.css">
</head>
<body>
    <div class="container">
        <div class="card" style="max-width: 500px; margin: 100px auto;">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h1>HRMS</h1>
                <p>人力资源管理系统</p>
            </div>
            
            <h2 style="text-align: center;">欢迎使用HRMS</h2>
            
            <div style="margin: 2rem 0;">
                <p>系统正在识别您的身份，请稍候...</p>
                <div class="loading-spinner"></div>
            </div>
            
            <div class="card" style="margin-top: 2rem; background: #f1f5f9;">
                <p style="margin: 0;">如果长时间没有跳转，请 <a href="/login.html" class="btn-link">前往登录页</a></p>
            </div>
        </div>
    </div>
    
    <style>
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4285f4;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    
    <script>
        // 页面加载后自动跳转到对应的用户主页
        document.addEventListener('DOMContentLoaded', function() {
            // 直接跳转到后端处理的/index路径，由后端决定跳转到哪个角色页面
            window.location.href = '/index';
        });
    </script>
</body>
</html>
