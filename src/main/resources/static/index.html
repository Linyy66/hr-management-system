<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>人力资源管理系统</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .menu { margin: 30px 0; }
        .menu a { display: inline-block; margin-right: 20px; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 4px; }
        .menu a:hover { background: #0056b3; }
        .content { margin-top: 30px; padding: 20px; border: 1px solid #eee; border-radius: 4px; }
        .result { margin-top: 20px; padding: 10px; background: #f8f9fa; border-radius: 4px; white-space: pre-wrap; }
    </style>
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
</head>
<body>
<div class="container">
    <h1>人力资源管理系统</h1>

    <!-- 功能菜单 -->
    <div class="menu">
        <a href="#dept">部门管理</a>
        <a href="#emp">员工管理</a>
        <a href="#pos">岗位管理</a>
    </div>

    <!-- 部门管理区域 -->
    <div id="dept" class="content">
        <h2>部门管理</h2>
        <button onclick="getDeptList()">查询所有部门</button>
        <div class="result" id="deptResult"></div>
    </div>

    <!-- 员工管理区域 -->
    <div id="emp" class="content" style="margin-top: 20px;">
        <h2>员工管理</h2>
        <button onclick="window.location.href='employee.html'">高级员工管理</button>
        <button onclick="getEmpList()">查询所有员工</button>
        <div class="result" id="empResult"></div>
    </div>

    <!-- 岗位管理区域 -->
    <div id="pos" class="content" style="margin-top: 20px;">
        <h2>岗位管理</h2>
        <button onclick="getPosList()">查询所有岗位</button>
        <div class="result" id="posResult"></div>
    </div>
</div>

<script>
    // 查询部门列表
    function getDeptList() {
        $.get("/hr/dept/list", function(data) {
            $("#deptResult").text(JSON.stringify(data, null, 2));
        }).fail(function() {
            $("#deptResult").text("查询失败，请检查服务是否正常");
        });
    }

    // 查询员工列表
    function getEmpList() {
        $.get("/hr/employee/list", function(data) {
            $("#empResult").text(JSON.stringify(data, null, 2));
        }).fail(function() {
            $("#empResult").text("查询失败，请检查服务是否正常");
        });
    }

    // 查询岗位列表
    function getPosList() {
        $.get("/hr/pos/list", function(data) {
            $("#posResult").text(JSON.stringify(data, null, 2));
        }).fail(function() {
            $("#posResult").text("查询失败，请检查服务是否正常");
        });
    }
</script>
</body>
</html>
