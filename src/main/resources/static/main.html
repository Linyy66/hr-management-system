<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>HRMS - 主界面</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="/app/styles.css">
</head>
<body>
<div class="container">
    <div class="card">
        <h1 id="title">HRMS</h1>
        <div class="small" id="userInfo">正在获取用户信息...</div>

        <div id="adminPanel" class="hidden panel">
            <h2>管理员面板</h2>

            <section class="card" style="padding:12px">
                <h3>角色管理</h3>
                <div class="form-row">
                    <label for="newRoleName">新角色名</label>
                    <input id="newRoleName" placeholder="例如 HR_AUDITOR" />
                    <button id="btnAddRole">添加角色</button>
                </div>
                <div class="small">提示：角色名会自动转成大写并唯一。</div>
                <table id="roleTable" style="width:100%; margin-top:10px; border-collapse:collapse;">
                    <thead>
                    <tr style="text-align:left; border-bottom:1px solid #e5e7eb">
                        <th style="padding:8px">ID</th>
                        <th style="padding:8px">角色名</th>
                        <th style="padding:8px">操作</th>
                    </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <div id="roleStatus" class="status"></div>
            </section>

            <section class="card" style="padding:12px; margin-top:12px">
                <h3>创建账号（管理员）</h3>
                <div class="form-row">
                    <label>用户名</label><input id="adm_user" />
                    <label>密码</label><input id="adm_pass" type="password" />
                    <label>角色</label>
                    <select id="adm_role"></select>
                    <button id="adm_create">创建</button>
                </div>
                <div id="adm_status" class="status"></div>
            </section>

            <section class="card" style="padding:12px; margin-top:12px">
                <h3>账号管理</h3>
                <div class="small">可以编辑用户角色、启用/禁用账户或删除（不能删除 admin）。</div>
                <table id="userTable" style="width:100%; margin-top:10px; border-collapse:collapse;">
                    <thead>
                    <tr style="text-align:left; border-bottom:1px solid #e5e7eb">
                        <th style="padding:8px">用户名</th>
                        <th style="padding:8px">角色</th>
                        <th style="padding:8px">启用</th>
                        <th style="padding:8px">操作</th>
                    </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <div id="userStatus" class="status"></div>
            </section>

        </div>

        <div id="hrPanel" class="hidden panel">
            <h2>人事面板（HR 专员 / 人事经理）</h2>
            <p>可管理档案、查看考勤等（示例页仅展示查询接口按钮）。</p>
            <button id="btnListOrgs">列出一级机构 (/api/org1)</button>
            <pre id="orgResult"></pre>
            <button id="btnListStaff">列出员工档案 (/api/staff)</button>
            <pre id="staffResult"></pre>
        </div>

        <div id="employeePanel" class="hidden panel">
            <h2>员工视图</h2>
            <p id="empWelcome"></p>
        </div>

        <div style="margin-top:12px">
            <button id="btnLogout" class="secondary">登出并返回登录</button>
        </div>
    </div>
</div>

<script src="/app/js/main.js"></script>
</body>
</html>
