<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>HRMS - 系统主页面</title>
    <link rel="stylesheet" href="app/styles.css">
</head>
<body>
<div class="header-bar">
    <h1>HRMS 人力资源管理系统</h1>
    <div class="user-info">
        当前角色：<span id="current-role"></span>
        <button onclick="authLogout()">退出登录</button>
    </div>
</div>

<!-- 功能标签栏 -->
<div class="tab-bar">
    <div class="tab-item active" data-panel="staff-panel">员工档案</div>
    <div class="tab-item" data-panel="org-panel">机构管理</div>
    <div class="tab-item" data-panel="attendance-panel" id="tab-attendance">考勤管理</div>
    <div class="tab-item" data-panel="admin-panel" id="tab-admin">系统管理</div>
</div>

<!-- 员工档案面板 -->
<div class="panel active" id="staff-panel">
    <h2>员工档案管理</h2>
    <div class="form-section">
        <h3>新增员工档案</h3>
        <input type="text" id="staff-archiveId" placeholder="档案ID（如202501010101）">
        <input type="text" id="staff-org1Id" placeholder="一级机构ID（如01）">
        <input type="text" id="staff-org2Id" placeholder="二级机构ID（如01）">
        <input type="text" id="staff-org3Id" placeholder="三级机构ID（如01）">
        <input type="text" id="staff-positionId" placeholder="职位ID（如FE001）">
        <input type="text" id="staff-name" placeholder="员工姓名">
        <input type="text" id="staff-mobile" placeholder="手机号">
        <button onclick="staffCreate()">创建档案</button>
    </div>
    <div class="list-section">
        <h3>员工列表</h3>
        <button onclick="staffRefresh()">刷新列表</button>
        <table id="staff-table">
            <thead>
            <tr>
                <th>档案ID</th>
                <th>姓名</th>
                <th>机构</th>
                <th>手机号</th>
                <th>状态</th>
            </tr>
            </thead>
            <tbody id="staff-table-body"></tbody>
        </table>
    </div>
</div>

<!-- 机构管理面板 -->
<div class="panel" id="org-panel">
    <h2>机构管理</h2>
    <div class="form-section">
        <h3>新增一级机构</h3>
        <input type="text" id="org1-id" placeholder="机构ID（如01）">
        <input type="text" id="org1-name" placeholder="机构名称（如技术中心）">
        <button onclick="org1Add()">添加一级机构</button>
    </div>
    <div class="list-section">
        <h3>一级机构列表</h3>
        <div id="org1-list"></div>
    </div>
</div>

<!-- 考勤管理面板 -->
<div class="panel" id="attendance-panel">
    <h2>考勤管理</h2>
    <p>考勤规则配置、打卡记录管理等功能（仅经理/管理员可见）</p>
</div>

<!-- 系统管理面板 -->
<div class="panel" id="admin-panel">
    <h2>系统管理</h2>
    <p>角色配置、权限管理等功能（仅管理员可见）</p>
</div>

<script src="app/js/auth.js"></script>
<script src="app/js/staff.js"></script>
<script src="app/js/org.js"></script>
<script>
    // 页面初始化：验证登录+角色控制
    window.onload = function() {
        const user = localStorage.getItem('hrms_user');
        if (!user) {
            window.location.href = 'login.html';
            return;
        }

        // 角色映射
        const roleMap = {
            'spec': '人事专员',
            'mgr': '人事经理',
            'admin': '管理员'
        };
        document.getElementById('current-role').textContent = roleMap[user];

        // 隐藏无权标签/面板
        if (user === 'spec') {
            document.getElementById('tab-admin').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'none';
        }
        if (user !== 'admin') {
            document.getElementById('admin-panel').style.display = 'none';
        }

        // 标签切换逻辑
        document.querySelectorAll('.tab-item').forEach(tab => {
            tab.addEventListener('click', function() {
                // 切换标签激活态
                document.querySelectorAll('.tab-item').forEach(item => item.classList.remove('active'));
                this.classList.add('active');
                // 切换面板显示
                const panelId = this.getAttribute('data-panel');
                document.querySelectorAll('.panel').forEach(panel => panel.classList.remove('active'));
                document.getElementById(panelId).classList.add('active');
            });
        });
    }
</script>
</body>
</html>
