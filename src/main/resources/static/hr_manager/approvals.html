<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>审批管理 - HRMS</title>
    <link rel="stylesheet" href="/app/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="logo">
                <h1>HRMS</h1>
                <span>人事经理平台</span>
            </div>
            <div class="nav-menu">
                <ul>
                    <li><a href="/hr_manager/index.html" class="nav-link">返回首页</a></li>
                </ul>
            </div>
            <div class="user-info">
                <span id="current-user">人事经理</span>
                <span class="role-badge hr_manager">人事经理</span>
                <button id="logout-btn" class="btn-secondary btn-small">退出</button>
            </div>
        </div>
    </nav>

    <div class="container main-content">
        <div class="card">
            <h2>审批管理</h2>
            <div class="approval-filters">
                <select id="approval-type">
                    <option value="all">全部类型</option>
                    <option value="leave">请假申请</option>
                    <option value="overtime">加班申请</option>
                    <option value="transfer">调岗申请</option>
                    <option value="resignation">离职申请</option>
                </select>
                <select id="approval-status">
                    <option value="all">全部状态</option>
                    <option value="pending">待审批</option>
                    <option value="approved">已批准</option>
                    <option value="rejected">已拒绝</option>
                </select>
                <button class="btn-primary">筛选</button>
            </div>
        </div>
        
        <div class="card">
            <h3>请假审批</h3>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>申请人</th>
                        <th>请假类型</th>
                        <th>天数</th>
                        <th>申请时间</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="leave-approvals-body">
                    <!-- 动态加载请假审批列表 -->
                </tbody>
            </table>
        </div>
        
        <div class="card">
            <h3>加班审批</h3>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>申请人</th>
                        <th>加班日期</th>
                        <th>小时数</th>
                        <th>申请时间</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="overtime-approvals-body">
                    <!-- 动态加载加班审批列表 -->
                </tbody>
            </table>
        </div>
        
        <div class="card">
            <h3>调岗审批</h3>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>申请人</th>
                        <th>原部门</th>
                        <th>目标部门</th>
                        <th>申请时间</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="transfer-approvals-body">
                    <!-- 动态加载调岗审批列表 -->
                </tbody>
            </table>
        </div>
        
        <div class="card">
            <h3>离职审批</h3>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>申请人</th>
                        <th>申请时间</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="resignation-approvals-body">
                    <!-- 动态加载离职审批列表 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 离职申请详情模态框 -->
    <div id="resignation-detail-modal" class="modal" style="display:none;">
        <div class="modal-content large">
            <div class="modal-header">
                <h2>离职申请详情</h2>
                <span class="close" onclick="closeResignationDetailModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>申请人:</label>
                    <span id="resignation-applicant"></span>
                </div>
                <div class="form-group">
                    <label>申请时间:</label>
                    <span id="resignation-apply-time"></span>
                </div>
                <div class="form-group">
                    <label>状态:</label>
                    <span id="resignation-status"></span>
                </div>
                <div class="form-group full-width">
                    <label>离职原因:</label>
                    <textarea id="resignation-reason-detail" rows="6" readonly></textarea>
                </div>
                <div class="form-actions">
                    <button id="approve-resignation-btn" class="btn-primary">批准</button>
                    <button id="reject-resignation-btn" class="btn-danger">拒绝</button>
                    <button class="btn-secondary" onclick="closeResignationDetailModal()">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/app/js/utils.js"></script>
    <script src="/app/js/hr_manager.js"></script>
</body>
</html>
